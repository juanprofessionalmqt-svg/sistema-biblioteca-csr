{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Repositorio CSR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-[#f0f4f9] min-h-screen flex items-center justify-center p-4">

    <div class="relative bg-white rounded-[28px] shadow-sm border border-gray-200/70 p-8 sm:p-10 w-full max-w-md space-y-6 overflow-hidden">
        
        <div class="absolute top-6 right-6">
            <img src="{% static 'CSR_icon.png' %}" alt="Logo CSR" class="w-12 h-12 object-contain drop-shadow-sm">
        </div>

        <div class="space-y-1.5 pr-14">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Crear cuenta</h1>
            <p class="text-xs text-gray-500 font-medium">Regístrate para acceder al repositorio</p>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="p-3 rounded-2xl text-xs font-semibold text-center bg-red-50 text-red-600 border border-red-100">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <form method="POST" onsubmit="return validarCoincidencia()" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Nombre(s)</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-3.5 text-gray-400 text-sm"></i>
                    <input type="text" name="nombre" required placeholder="Tu nombre" 
                           class="w-full bg-gray-50/50 border border-gray-300 rounded-2xl pl-10 pr-4 py-3 text-sm text-gray-800 outline-none focus:border-[#1d82dc] focus:bg-white focus:ring-2 focus:ring-blue-100 transition">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-semibold text-gray-700">Apellido(s)</label>
                    <label class="inline-flex items-center text-[11px] text-gray-500 font-medium cursor-pointer select-none">
                        <input type="checkbox" id="chkNoApellido" onclick="toggleApellido()" class="rounded text-[#1d82dc] focus:ring-0 mr-1.5">
                        Prefiero no decirlo
                    </label>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-user-tag absolute left-4 top-3.5 text-gray-400 text-sm"></i>
                    <input type="text" name="apellido" id="inputApellido" placeholder="Tus apellidos" 
                           class="w-full bg-gray-50/50 border border-gray-300 rounded-2xl pl-10 pr-4 py-3 text-sm text-gray-800 outline-none focus:border-[#1d82dc] focus:bg-white focus:ring-2 focus:ring-blue-100 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Correo electrónico</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-gray-400 text-sm"></i>
                    <input type="email" name="correo" required placeholder="usuario@colredentorita.edu.co" 
                           class="w-full bg-gray-50/50 border border-gray-300 rounded-2xl pl-10 pr-4 py-3 text-sm text-gray-800 outline-none focus:border-[#1d82dc] focus:bg-white focus:ring-2 focus:ring-blue-100 transition">
                </div>
            </div>

            <!-- Contraseña -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Contraseña</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-gray-400 text-sm"></i>
                    <input type="password" name="password" id="pass1" required placeholder="••••••••" 
                           class="w-full bg-gray-50/50 border border-gray-300 rounded-2xl pl-10 pr-10 py-3 text-sm text-gray-800 outline-none focus:border-[#1d82dc] focus:bg-white focus:ring-2 focus:ring-blue-100 transition">
                    <button type="button" onclick="togglePassword('pass1', 'eye1')" class="absolute right-3.5 top-3.5 text-gray-400 hover:text-gray-600">
                        <i id="eye1" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Confirmar Contraseña -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Confirmar contraseña</label>
                <div class="relative">
                    <i class="fa-solid fa-shield-halved absolute left-4 top-3.5 text-gray-400 text-sm"></i>
                    <input type="password" name="confirm_password" id="pass2" required placeholder="••••••••" 
                           class="w-full bg-gray-50/50 border border-gray-300 rounded-2xl pl-10 pr-10 py-3 text-sm text-gray-800 outline-none focus:border-[#1d82dc] focus:bg-white focus:ring-2 focus:ring-blue-100 transition">
                    <button type="button" onclick="togglePassword('pass2', 'eye2')" class="absolute right-3.5 top-3.5 text-gray-400 hover:text-gray-600">
                        <i id="eye2" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
                <p id="errorMsg" class="text-[11px] text-red-500 mt-1 hidden font-semibold">Las contraseñas no coinciden.</p>
            </div>

            <button type="submit" class="w-full bg-[#1d82dc] text-white py-3 rounded-full font-semibold text-sm hover:bg-blue-600 active:scale-[0.99] transition shadow-sm mt-2">
                Registrarme
            </button>
        </form>

        <div class="pt-2 text-center border-t border-gray-100">
            <p class="text-xs text-gray-500">
                ¿Ya tienes una cuenta? 
                <a href="{% url 'login' %}" class="font-bold text-[#1d82dc] hover:underline">Iniciar sesión</a>
            </p>
        </div>

    </div>

    <script>
        function toggleApellido() {
            const chk = document.getElementById('chkNoApellido');
            const input = document.getElementById('inputApellido');
            if (chk.checked) {
                input.value = '';
                input.disabled = true;
                input.classList.add('opacity-40', 'bg-gray-100', 'cursor-not-allowed');
            } else {
                input.disabled = false;
                input.classList.remove('opacity-40', 'bg-gray-100', 'cursor-not-allowed');
            }
        }

        function togglePassword(inputId, eyeId) {
            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);
            if (input.type === "password") {
                input.type = "text";
                eye.classList.remove("fa-eye");
                eye.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                eye.classList.remove("fa-eye-slash");
                eye.classList.add("fa-eye");
            }
        }

        function validarCoincidencia() {
            const p1 = document.getElementById('pass1').value;
            const p2 = document.getElementById('pass2').value;
             const error = document.getElementById('errorMsg');

            if (p1 !== p2) {
                error.classList.remove('hidden');
                return false;
            }
            error.classList.add('hidden');
            return true;
        }
    </script>
</body>
</html>
